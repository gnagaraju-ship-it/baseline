<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni by Canvs — Elevation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#C2410C}a:hover{color:#9A3412}
button{font:inherit;cursor:pointer}input{font:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.rl{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#52525B;text-decoration:none;border:1px solid transparent;background:transparent}
.rl:hover{background:#F4F4F5}
.rl.on{background:#FFFFFF;border-color:#E4E4E7;color:#18181B;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sep{width:28px;height:1px;background:#E4E4E7;margin:4px 0}
.h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#52525B}
.nf{display:flex;align-items:center;height:34px;border-radius:7px;background:#F4F4F5;padding:0 8px;gap:4px}
.nf input{width:100%;min-width:0;border:0;background:transparent;text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:#18181B;-moz-appearance:textfield}
.nf input::-webkit-inner-spin-button{-webkit-appearance:none}
.nf input:focus{outline:none}
.nf:focus-within{box-shadow:0 0 0 2px #C2410C}
.chip{-webkit-appearance:none;appearance:none;border:0;padding:0;width:32px;height:32px;border-radius:7px;background:none;cursor:pointer;flex:none}
.chip::-webkit-color-swatch-wrapper{padding:0}.chip::-webkit-color-swatch{border:none;border-radius:7px}.chip::-moz-color-swatch{border:none;border-radius:7px}
.pr:hover{background:#F4F4F5}
:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #18181B; background: #FFFFFF; display: flex; flex-wrap: wrap; min-height: 100vh; font-size: 14px">

  <div style="flex: 1 1 384px; max-width: 100%; display: flex; background: #FAFAFA; border-right: 1px solid #EAEAEC">
    <nav aria-label="Workspace" style="width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-right: 1px solid #EAEAEC">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #18181B; display: flex; align-items: center; justify-content: center; margin-bottom: 14px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FF5A1F"></span></div>
      <button class="rl" aria-label="Projects"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <div class="sep"></div>
      <a class="rl" href="index.html" aria-label="Color"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.4-1.8-.4-1.2.4-2.2 1.6-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></a>
      <a class="rl" href="typography.html" aria-label="Typography"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></a>
      <a class="rl" href="grids.html" aria-label="Grids"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg></a>
      <a class="rl" href="spacing.html" aria-label="Spacing"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16M4 20h16M12 8v8M9 11l3-3 3 3M9 13l3 3 3-3"/></svg></a>
      <a class="rl on" href="elevation.html" aria-label="Elevation" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="11" height="11" rx="2"/><path d="M4 14V6a2 2 0 0 1 2-2h8"/></svg></a>
      <div class="sep"></div>
      <a class="rl" href="preview.html" aria-label="UI preview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></a>
      <button class="rl" aria-label="Documentation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></button>
      <div style="flex: 1"></div>
      <button class="rl" aria-label="Toggle dark mode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </nav>

    <aside aria-label="Elevation settings" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #E4E4E7">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #18181B; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FF5A1F"></span></div>
        <div style="font-size: 16px; font-weight: 600">Elevation</div>
      </div>
      <div style="padding: 20px; display: flex; flex-direction: column; gap: 22px">
        <section style="display: flex; flex-direction: column; gap: 4px">
          <h3 class="h3" style="margin-bottom: 8px">Presets</h3>
          <sc-for list="{{presetGroups}}" as="g" hint-placeholder-count="2">
            <div style="font-size: 10px; font-weight: 600; letter-spacing: .1em; color: #52525B; padding: 8px 4px 4px">{{g.name}}</div>
            <sc-for list="{{g.items}}" as="p" hint-placeholder-count="5">
              <button class="pr" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 38px; border: 0; border-radius: 8px; background: {{p.bg}}; color: {{p.color}}; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; font-weight: {{p.weight}}">{{p.label}}<span style="font-size: 11px; opacity: .85">{{p.count}}</span></button>
            </sc-for>
          </sc-for>
          <div style="height: 1px; background: #E4E4E7; margin: 8px 0"></div>
          <button class="pr" onClick="{{custom.pick}}" aria-pressed="{{custom.pressed}}" style="height: 38px; border: 0; border-radius: 8px; background: {{custom.bg}}; color: {{custom.color}}; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; font-weight: {{custom.weight}}">Custom<span style="font-size: 11px; opacity: .85">{{custom.count}}</span></button>
        </section>
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h3 class="h3">Base colour</h3>
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500"><label for="shadow-hex">Shadow</label><span style="font-size: 11px; font-weight: 600; color: #52525B">HEX</span></div>
          <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px">
            <input class="chip" type="color" value="{{shadowPicker}}" onChange="{{setShadow}}" aria-label="Shadow colour picker">
            <input id="shadow-hex" class="mono" type="text" value="{{shadowText}}" onChange="{{setShadow}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 13px; outline: none">
          </div>
        </section>
      </div>
      <div style="flex: 1"></div>
      <div style="padding: 16px 20px; border-top: 1px solid #E4E4E7; font-size: 13px; color: #52525B">Omni by Canvs</div>
    </aside>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px 0 28px; border-bottom: 1px solid #EAEAEC; min-height: 64px">
      <nav aria-label="Views" style="display: flex; gap: 4px">
        <a href="elevation.html" aria-current="page" style="display: flex; align-items: center; height: 64px; padding: 0 14px; text-decoration: none; color: #18181B; font-weight: 600; box-shadow: inset 0 -2px 0 #E2531B">Scale</a>
        <a href="preview.html" style="display: flex; align-items: center; height: 64px; padding: 0 14px; text-decoration: none; color: #52525B; font-weight: 500">UI preview</a>
      </nav>
      <button style="height: 40px; padding: 0 14px; border: 0; border-radius: 9px; background: #D2400B; color: #FFFFFF; font-size: 13px; font-weight: 600">Export</button>
    </div>

    <div style="padding: 20px 28px 48px; overflow-x: auto">
      <div style="min-width: 900px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: grid; grid-template-columns: 40px minmax(200px, 2.2fr) 1fr repeat(5, minmax(76px, .8fr)) 120px; gap: 10px; padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #52525B">
          <span></span><span>TOKEN NAME</span><span>LAYER</span><span style="text-align: center">X</span><span style="text-align: center">Y</span><span style="text-align: center">BLUR</span><span style="text-align: center">SPREAD</span><span style="text-align: center">COLOUR %</span><span style="text-align: center">PREVIEW</span>
        </div>

        <sc-for list="{{tokens}}" as="t" hint-placeholder-count="5">
          <section aria-label="{{t.full}}" style="border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF; display: grid; grid-template-columns: 40px minmax(200px, 2.2fr) minmax(0, 1fr) 120px; align-items: stretch">
            <div style="display: flex; align-items: center; justify-content: center; border-right: 1px solid #F0F0F2">
              <button onClick="{{t.remove}}" aria-label="{{t.removeLabel}}" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: #52525B; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
            </div>
            <div style="padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #F0F0F2">
              <div class="mono" style="display: flex; align-items: center; height: 34px; border-radius: 7px; background: #F4F4F5; padding: 0 10px; font-size: 13px">
                <label for="{{t.nid}}" style="color: #52525B">elevation-</label>
                <input id="{{t.nid}}" type="text" value="{{t.name}}" onChange="{{t.rename}}" class="mono" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 13px; font-weight: 600; outline: none">
              </div>
              <button onClick="{{t.addLayer}}" style="align-self: flex-start; height: 30px; padding: 0 10px; border: 1px solid #E4E4E7; border-radius: 7px; background: #FFFFFF; font-size: 12px; color: #3F3F46">+ Layer</button>
            </div>
            <div style="display: flex; flex-direction: column">
              <sc-for list="{{t.layers}}" as="l" hint-placeholder-count="1">
                <div style="display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, minmax(76px, .8fr)); gap: 10px; align-items: center; padding: 14px 12px; border-bottom: 1px solid #F4F4F5; flex: 1">
                  <span class="mono" style="font-size: 12px; color: #52525B; display: flex; align-items: center; gap: 6px">{{l.label}}<sc-if value="{{l.canRemove}}" hint-placeholder-val="{{ false }}"><button onClick="{{l.remove}}" aria-label="Remove layer" style="width: 24px; height: 24px; border: 0; border-radius: 5px; background: #F4F4F5; color: #52525B; font-size: 14px; line-height: 1">×</button></sc-if></span>
                  <sc-for list="{{l.fields}}" as="f" hint-placeholder-count="5">
                    <div class="nf"><input type="number" value="{{f.v}}" onChange="{{f.set}}" aria-label="{{f.aria}}"><span style="font-size: 10px; color: #71717A">{{f.unit}}</span></div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; justify-content: center; border-left: 1px solid #F0F0F2; background: #FAFAFA; border-radius: 0 12px 12px 0; padding: 18px">
              <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 10px; background: #FFFFFF; box-shadow: {{t.shadow}}"></div>
            </div>
          </section>
        </sc-for>

        <button onClick="{{addToken}}" style="height: 44px; border: 1px dashed #D4D4D8; border-radius: 12px; background: transparent; color: #3F3F46; font-size: 13px">+ Add level</button>

        <div class="mono" style="margin-top: 8px; padding: 14px 16px; border-radius: 10px; background: #18181B; color: #E4E4E7; font-size: 12px; line-height: 1.7; white-space: pre-wrap">{{css}}</div>
      </div>
    </div>
  </main>
</div>
</template>
<script id="logic" type="text/plain">
function L(x, y, b, s, o) { return { x: x, y: y, blur: b, spread: s, op: o }; }
var PRESETS = {
  tailwind: { label: "Tailwind", group: "SOFT", levels: [["2xs", [L(0, 1, 0, 0, 5)]], ["xs", [L(0, 1, 2, 0, 5)]], ["sm", [L(0, 1, 3, 0, 10), L(0, 1, 2, -1, 10)]], ["md", [L(0, 4, 6, -1, 10), L(0, 2, 4, -2, 10)]], ["lg", [L(0, 10, 15, -3, 10), L(0, 4, 6, -4, 10)]], ["xl", [L(0, 20, 25, -5, 10), L(0, 8, 10, -6, 10)]], ["2xl", [L(0, 25, 50, -12, 25)]]] },
  soft: { label: "Soft ambient", group: "SOFT", levels: [["xs", [L(0, 1, 3, 0, 8)]], ["sm", [L(0, 2, 8, 0, 10)]], ["md", [L(0, 6, 16, 0, 12)]], ["lg", [L(0, 12, 32, 0, 14)]], ["xl", [L(0, 24, 64, 0, 16)]]] },
  fluent: { label: "Fluent", group: "SOFT", levels: [["2", [L(0, 1, 2, 0, 14), L(0, 0, 2, 0, 12)]], ["4", [L(0, 2, 4, 0, 14), L(0, 0, 2, 0, 12)]], ["8", [L(0, 4, 8, 0, 14), L(0, 0, 2, 0, 12)]], ["16", [L(0, 8, 16, 0, 14), L(0, 0, 2, 0, 12)]], ["28", [L(0, 14, 28, 0, 24), L(0, 0, 8, 0, 20)]], ["64", [L(0, 32, 64, 0, 24), L(0, 0, 8, 0, 20)]]] },
  ant: { label: "Ant Design", group: "SOFT", levels: [["1", [L(0, 6, 16, 0, 8), L(0, 3, 6, -4, 12), L(0, 9, 28, 8, 5)]], ["2", [L(0, 3, 6, -4, 12), L(0, 6, 16, 0, 8), L(0, 9, 28, 8, 5)]], ["3", [L(0, 12, 48, 16, 3), L(0, 9, 28, 0, 5), L(0, 6, 16, -8, 8)]]] },
  bootstrap: { label: "Bootstrap", group: "SOFT", levels: [["sm", [L(0, 2, 4, 0, 8)]], ["md", [L(0, 8, 16, 0, 15)]], ["lg", [L(0, 16, 48, 0, 18)]]] },
  material: { label: "Material", group: "HARD", levels: [1, 2, 3, 4, 6, 8, 12, 16, 24].map(function (dp) { return [String(dp), [L(0, Math.round(dp / 2), dp, 0, 20), L(0, Math.max(1, Math.round(dp / 4)), Math.round(dp / 2), 0, 14)]]; }) },
  carbon: { label: "Carbon", group: "HARD", levels: [["low", [L(0, 1, 2, 0, 30)]], ["raised", [L(0, 2, 6, 0, 30)]], ["overlay", [L(0, 4, 8, 0, 30)]]] },
  custom: { label: "Custom", group: "", levels: [["xs", [L(0, 1, 2, 0, 10)]], ["sm", [L(0, 2, 6, 0, 12)]], ["md", [L(0, 6, 14, 0, 14)]], ["lg", [L(0, 14, 32, 0, 18)]]] }
};
function load(k) { return PRESETS[k].levels.map(function (lv) { return { name: lv[0], layers: lv[1].map(function (l) { return Object.assign({}, l); }) }; }); }
function rgb(h) { return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
function norm(h) { h = String(h || "").trim().replace(/^#/, ""); return /^[0-9a-fA-F]{6}$/.test(h) ? h.toUpperCase() : null; }

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { preset: "soft", tokens: load("soft"), shadow: "#000000" }; }
  edit(fn) { var t = this.state.tokens.map(function (x) { return { name: x.name, layers: x.layers.map(function (l) { return Object.assign({}, l); }) }; }); fn(t); this.setState({ tokens: t, preset: this.state.preset }); }
  renderVals() {
    var self = this, s = this.state, base = norm(s.shadow) || "000000", c = rgb(base);
    function css(layers) { return layers.map(function (l) { return l.x + "px " + l.y + "px " + l.blur + "px " + l.spread + "px rgba(" + c.join(", ") + ", " + (l.op / 100) + ")"; }).join(", "); }
    function item(k) { var on = s.preset === k; return { label: PRESETS[k].label, count: PRESETS[k].levels.length, pressed: on ? "true" : "false", bg: on ? "#E2531B" : "transparent", color: on ? "#FFFFFF" : "#27272A", weight: on ? 600 : 400, pick: function () { self.setState({ preset: k, tokens: load(k) }); } }; }
    var FIELDS = [["x", "px", "X offset"], ["y", "px", "Y offset"], ["blur", "px", "Blur"], ["spread", "px", "Spread"], ["op", "%", "Colour opacity"]];
    var tokens = s.tokens.map(function (t, ti) {
      return {
        name: t.name, full: "elevation-" + t.name, nid: "tok-" + ti, removeLabel: "Delete elevation-" + t.name, shadow: css(t.layers),
        rename: function (e) { var v = e.target.value; self.edit(function (a) { a[ti].name = v; }); },
        remove: function () { self.edit(function (a) { a.splice(ti, 1); }); },
        addLayer: function () { self.edit(function (a) { a[ti].layers.push(L(0, 1, 2, 0, 6)); }); },
        layers: t.layers.map(function (l, li) {
          return {
            label: "Layer " + (li + 1), canRemove: t.layers.length > 1,
            remove: function () { self.edit(function (a) { a[ti].layers.splice(li, 1); }); },
            fields: FIELDS.map(function (f) { return { v: l[f[0]], unit: f[1], aria: "elevation-" + t.name + " layer " + (li + 1) + " " + f[2], set: function (e) { var v = parseFloat(e.target.value); if (isNaN(v)) v = 0; self.edit(function (a) { a[ti].layers[li][f[0]] = v; }); } }; })
          };
        })
      };
    });
    return {
      presetGroups: ["SOFT", "HARD"].map(function (g) { return { name: g, items: Object.keys(PRESETS).filter(function (k) { return PRESETS[k].group === g; }).map(item) }; }),
      custom: item("custom"),
      shadowText: s.shadow, shadowPicker: "#" + base.toLowerCase(),
      setShadow: function (e) { self.setState({ shadow: e.target.value }); },
      tokens: tokens,
      addToken: function () { self.edit(function (a) { var last = a[a.length - 1]; a.push({ name: "level-" + (a.length + 1), layers: last ? last.layers.map(function (l) { return { x: l.x, y: l.y * 2, blur: l.blur * 2, spread: l.spread, op: l.op }; }) : [L(0, 2, 6, 0, 12)] }); }); },
      css: ":root {\n" + s.tokens.map(function (t) { return "  --elevation-" + t.name + ": " + css(t.layers) + ";"; }).join("\n") + "\n}"
    };
  }
}
</script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var tpl = document.getElementById('tpl').content;
  var code = document.getElementById('logic').textContent;
  var queued = false, comp;
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var n = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, n);
    schedule();
  };
  DCLogic.prototype.forceUpdate = function () { schedule(); };
  function schedule() { if (queued) return; queued = true; Promise.resolve().then(function () { queued = false; render(); }); }
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var m = /^'(.*)'$|^"(.*)"$/.exec(path); if (m) return m[1] != null ? m[1] : m[2];
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
  }
  function interp(str, scope) { return str.replace(HOLE, function (_, p) { var v = get(scope, p); return v == null || v === false ? '' : String(v); }); }
  function evType(el, name) {
    var ev = name.slice(2);
    if (ev === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase(), tag = el.localName;
      if (tag === 'select' || t === 'checkbox' || t === 'radio') return 'change';
      return 'input';
    }
    return ev === 'doubleclick' ? 'dblclick' : ev;
  }
