<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni by Canvs — Type scale</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Raleway:wght@300;400;500;600;700;800&amp;family=Nunito:wght@300;400;500;600;700;800&amp;family=Manrope:wght@300;400;500;600;700;800&amp;family=DM+Sans:wght@300;400;500;600;700;800&amp;family=Playfair+Display:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#C2410C}a:hover{color:#9A3412}
button{font:inherit;cursor:pointer}input,select{font:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.rl{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#52525B;text-decoration:none;border:1px solid transparent;background:transparent}
.rl:hover{background:#F4F4F5}
.rl.on{background:#FFFFFF;border-color:#E4E4E7;color:#18181B;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sep{width:28px;height:1px;background:#E4E4E7;margin:4px 0}
.h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#52525B}
.rng{width:100%;accent-color:#E2531B;margin:0}
.inp{box-sizing:border-box;height:40px;border:1px solid #E4E4E7;border-radius:8px;padding:0 10px;background:#FFFFFF;color:#18181B;font-size:13px}
.trow:hover{background:#FAFAFA}
.tb{display:flex;align-items:center;gap:8px;height:64px;padding:0 14px;border:0;background:transparent;color:#52525B;font-weight:500;font-size:14px}
:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #18181B; background: #FFFFFF; display: flex; flex-wrap: wrap; min-height: 100vh; font-size: 14px">

  <div style="flex: 1 1 384px; max-width: 100%; display: flex; background: #FAFAFA; border-right: 1px solid #EAEAEC">
    <nav aria-label="Workspace" style="width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-right: 1px solid #EAEAEC">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #18181B; display: flex; align-items: center; justify-content: center; margin-bottom: 14px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FF5A1F"></span></div>
      <button class="rl" aria-label="Projects"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <div class="sep"></div>
      <a class="rl" href="index.html" aria-label="Color"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.4-1.8-.4-1.2.4-2.2 1.6-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></a>
      <a class="rl on" href="typography.html" aria-label="Typography" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></a>
      <a class="rl" href="grids.html" aria-label="Grids"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg></a>
      <a class="rl" href="spacing.html" aria-label="Spacing"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16M4 20h16M12 8v8M9 11l3-3 3 3M9 13l3 3 3-3"/></svg></a>
      <a class="rl" href="elevation.html" aria-label="Elevation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="11" height="11" rx="2"/><path d="M4 14V6a2 2 0 0 1 2-2h8"/></svg></a>
      <div class="sep"></div>
      <a class="rl" href="preview.html" aria-label="UI preview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></a>
      <button class="rl" aria-label="Documentation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></button>
      <div style="flex: 1"></div>
      <button class="rl" aria-label="Toggle dark mode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </nav>

    <aside aria-label="Type scale settings" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #E4E4E7">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #18181B; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FF5A1F"></span></div>
        <div style="font-size: 16px; font-weight: 600">Type Scale</div>
      </div>
      <div style="padding: 20px; display: flex; flex-direction: column; gap: 22px">

        <section style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center"><h3 class="h3">Platform</h3><span style="font-size: 10px; font-weight: 600; letter-spacing: .06em; color: #52525B; border: 1px solid #E4E4E7; border-radius: 4px; padding: 2px 6px">PROJECT</span></div>
          <div role="group" aria-label="Platform" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 1px solid #E4E4E7; border-radius: 10px; background: #FFFFFF">
            <sc-for list="{{platforms}}" as="p" hint-placeholder-count="4">
              <button onClick="{{p.pick}}" aria-label="{{p.label}}" aria-pressed="{{p.pressed}}" style="height: 36px; border: 1px solid {{p.border}}; border-radius: 7px; background: {{p.bg}}; color: {{p.color}}; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
              </button>
            </sc-for>
          </div>
        </section>

        <sc-if value="{{isWeb}}" hint-placeholder-val="{{ true }}">
          <section style="display: flex; flex-direction: column; gap: 12px">
            <h3 class="h3">Scale</h3>
            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500"><label for="base-range">Base size</label><span class="mono" style="font-weight: 600">{{base}}px</span></div>
            <div style="display: flex; align-items: center; gap: 12px">
              <input id="base-range" class="rng" type="range" min="10" max="24" step="1" value="{{base}}" onChange="{{setBase}}">
              <label for="base-num" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Base size in px</label>
              <input id="base-num" class="inp mono" type="number" min="10" max="24" value="{{base}}" onChange="{{setBase}}" style="width: 64px">
            </div>
            <label for="ratio" style="font-size: 13px; font-weight: 500">Scale ratio</label>
            <x-select id="ratio" class="inp mono" value="{{ratio}}" onChange="{{setRatio}}" style="width: 100%">
              <sc-for list="{{ratios}}" as="r" hint-placeholder-count="8"><option value="{{r.v}}">{{r.label}}</option></sc-for>
            </x-select>
            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500">Line grid <span class="mono" style="font-size: 11px; font-weight: 400; color: #52525B">snaps line heights</span></div>
            <div role="group" aria-label="Line grid" style="display: flex; gap: 6px">
              <sc-for list="{{grids}}" as="g" hint-placeholder-count="2">
                <button onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{g.border}}; background: {{g.bg}}; color: {{g.color}}; font-size: 12px; font-weight: 500">{{g.label}}</button>
              </sc-for>
            </div>
          </section>
        </sc-if>

        <section style="display: flex; flex-direction: column; gap: 10px">
          <h3 class="h3">Presets</h3>
          <div role="group" aria-label="Preset" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
              <button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.color}}; font-size: 12px; font-weight: 500">{{p.label}}</button>
            </sc-for>
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px">
          <h3 class="h3">Fonts</h3>
          <sc-for list="{{fonts}}" as="f" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500"><label for="{{f.id}}">{{f.label}}</label><span class="mono" style="font-size: 11px; font-weight: 400; color: #52525B">{{f.value}}</span></div>
              <div style="display: flex; gap: 6px">
                <x-select id="{{f.id}}" class="inp" value="{{f.value}}" onChange="{{f.set}}" disabled="{{f.locked}}" style="flex: 1; min-width: 0; font-family: {{f.css}}">
                  <sc-for list="{{f.options}}" as="o" hint-placeholder-count="6"><option value="{{o}}">{{o}}</option></sc-for>
                </x-select>
                <button aria-label="{{f.uploadLabel}}" style="width: 40px; height: 40px; border: 1px solid #E4E4E7; border-radius: 8px; background: #FFFFFF; color: #52525B; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg></button>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{isApple}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; font-size: 12px; line-height: 1.55; color: #52525B">SF Pro is Apple’s system font — not available via Google Fonts. Use <span class="mono">-apple-system</span> in your CSS stack.</p>
          </sc-if>
        </section>

        <sc-if value="{{isWeb}}" hint-placeholder-val="{{ true }}">
          <section style="display: flex; flex-direction: column; gap: 12px">
            <h3 class="h3">Responsive</h3>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500">Desktop <span style="font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: #18181B; color: #FFFFFF">BASE</span></div>
            <sc-for list="{{resp}}" as="r" hint-placeholder-count="2">
              <div style="display: grid; grid-template-columns: 36px 1fr 44px 96px; align-items: center; gap: 10px">
                <button role="switch" aria-checked="{{r.checked}}" aria-label="{{r.switchLabel}}" onClick="{{r.flip}}" style="width: 36px; height: 20px; border: 0; border-radius: 999px; background: {{r.track}}; padding: 2px; display: flex; justify-content: {{r.justify}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.2)"></span></button>
                <label for="{{r.id}}" style="font-size: 13px">{{r.label}}</label>
                <span class="mono" style="font-size: 12px; text-align: right; color: #3F3F46">{{r.pctLabel}}</span>
                <input id="{{r.id}}" class="rng" type="range" min="-30" max="0" step="1" value="{{r.pct}}" onChange="{{r.set}}" disabled="{{r.off}}">
              </div>
            </sc-for>
            <p style="margin: 0; font-size: 12px; line-height: 1.55; color: #52525B">Headings shrink on smaller breakpoints; body and labels stay put.</p>
          </section>
        </sc-if>
      </div>
      <div style="flex: 1"></div>
      <div style="padding: 16px 20px; border-top: 1px solid #E4E4E7; font-size: 13px; color: #52525B">Omni by Canvs</div>
    </aside>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px 0 28px; border-bottom: 1px solid #EAEAEC; min-height: 64px">
      <div role="tablist" aria-label="Views" style="display: flex; gap: 4px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button class="tb" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="color: {{t.color}}; font-weight: {{t.weight}}; box-shadow: inset 0 -2px 0 {{t.line}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}
            <sc-if value="{{t.hasCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: #FFF1EB; color: #C2410C; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{count}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; padding: 10px 0; align-items: center">
        <div role="group" aria-label="Unit" style="display: inline-flex; padding: 3px; border: 1px solid #E4E4E7; border-radius: 9px; gap: 2px">
          <sc-for list="{{units}}" as="u" hint-placeholder-count="3">
            <button onClick="{{u.pick}}" aria-pressed="{{u.pressed}}" class="mono" style="height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: {{u.bg}}; color: {{u.color}}; font-size: 12px">{{u.label}}</button>
          </sc-for>
        </div>
        <button style="height: 40px; padding: 0 10px 0 14px; border: 0; border-radius: 9px; background: #D2400B; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px">Export <span style="height: 20px; padding: 0 6px; border-radius: 5px; background: rgba(255,255,255,.2); font-size: 11px; display: inline-flex; align-items: center">{{count}}</span></button>
      </div>
    </div>

    <div style="padding: 28px 28px 56px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start">
        <div style="max-width: 560px">
          <h1 style="margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.01em">Type Scale</h1>
          <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #52525B">Click any step to add weight variants or override line height and letter spacing.</p>
        </div>
        <sc-if value="{{showViews}}" hint-placeholder-val="{{ true }}">
          <div role="group" aria-label="Breakpoint" style="display: inline-flex; padding: 3px; background: #F0F0F2; border-radius: 9px; gap: 2px">
            <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
              <button onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: {{v.bg}}; box-shadow: {{v.shadow}}; color: {{v.color}}; font-size: 13px; font-weight: 500">{{v.label}}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{isScale}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 28px">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
            <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; align-items: baseline">
                <div style="display: flex; gap: 10px; align-items: baseline"><h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em">{{g.title}}</h2><span style="font-size: 12px; color: #52525B">{{g.font}}</span></div>
                <span class="mono" style="font-size: 11px; color: #52525B">{{g.count}} steps</span>
              </div>
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
                <div style="border: 1px solid {{r.border}}; border-radius: 10px; background: #FFFFFF; overflow: hidden; box-shadow: {{r.glow}}">
                  <button class="trow" onClick="{{r.toggle}}" aria-expanded="{{r.expanded}}" style="width: 100%; border: 0; background: {{r.headBg}}; display: grid; grid-template-columns: 180px minmax(0, 1fr) auto 24px; align-items: center; gap: 16px; padding: 12px 16px; text-align: left; min-height: 64px">
                    <span class="mono" style="font-size: 14px; color: #52525B">{{r.name}}</span>
                    <span style="font-family: {{r.fam}}; font-size: {{r.size}}px; line-height: {{r.lh}}px; font-weight: {{r.weight}}; letter-spacing: {{r.tr}}em; color: #18181B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The quick brown fox</span>
                    <span style="display: grid; grid-template-columns: repeat(3, auto); column-gap: 14px; text-align: right">
                      <span class="mono" style="font-size: 13px; font-weight: 700">{{r.sizeL}}</span><span class="mono" style="font-size: 13px; font-weight: 700">{{r.lhL}}</span><span class="mono" style="font-size: 13px; font-weight: 700">{{r.trL}}</span>
                      <span class="mono" style="font-size: 9.5px; letter-spacing: .06em; color: #52525B">SIZE</span><span class="mono" style="font-size: 9.5px; letter-spacing: .06em; color: #52525B">LINE-H</span><span class="mono" style="font-size: 9.5px; letter-spacing: .06em; color: #52525B">TRACK</span>
                    </span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{r.rot}}deg); transition: transform .15s"><path d="M9 6l6 6-6 6"/></svg>
                  </button>
                  <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
                    <div style="border-top: 1px solid #FBD5C4; background: #FFF7F3; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
                      <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: #52525B">WEIGHT VARIANTS</div>
                      <div role="group" aria-label="Weight variants" style="display: flex; flex-wrap: wrap; gap: 6px">
                        <sc-for list="{{r.chips}}" as="c" hint-placeholder-count="5">
                          <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center">{{c.label}}<span class="mono" style="font-weight: 400; opacity: .75">{{c.w}}</span></button>
                        </sc-for>
                      </div>
                      <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: #52525B">OVERRIDES</div>
                      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
                        <div style="display: flex; flex-direction: column; gap: 6px"><label for="{{r.lhId}}" style="font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: #52525B">LINE HEIGHT (PX)</label><input id="{{r.lhId}}" class="inp mono" type="number" min="8" step="1" value="{{r.lh}}" onChange="{{r.setLh}}"></div>
                        <div style="display: flex; flex-direction: column; gap: 6px"><label for="{{r.trId}}" style="font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: #52525B">LETTER SPACING (EM)</label><input id="{{r.trId}}" class="inp mono" type="number" step="0.001" value="{{r.tr}}" onChange="{{r.setTr}}"></div>
                      </div>
                      <sc-if value="{{r.overridden}}" hint-placeholder-val="{{ false }}"><button onClick="{{r.reset}}" style="align-self: flex-start; border: 0; background: transparent; padding: 4px 0; color: #C2410C; font-size: 12px; font-weight: 600">Reset to scale</button></sc-if>
                    </div>
                  </sc-if>
                  <sc-for list="{{r.kids}}" as="k" hint-placeholder-count="0">
                    <div style="display: grid; grid-template-columns: 180px minmax(0, 1fr) auto 24px; align-items: center; gap: 16px; padding: 10px 16px 10px 36px; border-top: 1px solid #F0F0F2; background: #FCFCFC">
                      <span class="mono" style="font-size: 12px; color: #52525B">{{k.name}}</span>
                      <span style="font-family: {{r.fam}}; font-size: {{r.size}}px; line-height: {{r.lh}}px; font-weight: {{k.weight}}; letter-spacing: {{r.tr}}em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The quick brown fox</span>
                      <span class="mono" style="font-size: 12px; font-weight: 600; text-align: right">{{r.sizeL}} · {{r.lhL}} · {{k.wLabel}}</span>
                      <span></span>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
            </section>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{isPreview}}" hint-placeholder-val="{{ false }}">
        <article style="border: 1px solid #E4E4E7; border-radius: 14px; padding: 40px; max-width: 760px; display: flex; flex-direction: column; gap: 16px">
